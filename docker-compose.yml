version: '3.8'
services:
  ai-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn src.api.api_server:app --host 0.0.0.0 --port 8000
  backend:
    build: ./dotnet-backend
    ports:
      - "5000:80"
    depends_on:
      - ai-service
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend
