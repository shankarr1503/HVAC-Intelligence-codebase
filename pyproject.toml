[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-intelligence"
version = "0.1.0"
description = "Intelligent HVAC optimization platform for energy-efficient buildings."
authors = [
    {name = "HVAC Intelligence Contributors"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scipy",
    "stable-baselines3[extra]",
    "casadi",
    "gymnasium",
    "matplotlib",
    "streamlit",
]

[tool.setuptools.packages.find]
# code imports the package as `src.<module>`, so install it under that name
include = ["src*"]
